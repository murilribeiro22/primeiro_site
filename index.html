<<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Horta Interativa</title>
    <style>
        /* Estilos embutidos para facilitar */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7eedf;
            color: #4a3b32;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #2c5e3b;
        }

        .container-horta {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .canteiro {
            background-color: #8b5a2b; /* Cor de terra */
            border: 4px solid #5c3a1a;
            border-radius: 15px;
            padding: 20px;
            width: 120px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 6px 0 #5c3a1a;
        }

        .canteiro:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        .vegetal {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
        }

        .nome-vegetal {
            background-color: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .placar {
            background-color: #2c5e3b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>🥕 Horta da Fazenda 🍅</h1>
    <p>Clique nos canteiros para colher os vegetais maduros!</p>

    <div class="container-horta">
        <div class="canteiro" onclick="colher('cenoura')">
            <span class="vegetal">🥕</span>
            <span class="nome-vegetal">Cenoura</span>
        </div>

        <div class="canteiro" onclick="colher('tomate')">
            <span class="vegetal">🍅</span>
            <span class="nome-vegetal">Tomate</span>
        </div>

        <div class="canteiro" onclick="colher('alface')">
            <span class="vegetal">🥬</span>
            <span class="nome-vegetal">Alface</span>
        </div>
    </div>

    <div class="placar">
        <p>🧺 <strong>Sua Cesta de Colheita:</strong></p>
        <p>Cenouras: <span id="qtd-cenoura">0</span></p>
        <p>Tomates: <span id="qtd-tomate">0</span></p>
        <p>Alfaces: <span id="qtd-alface">0</span></p>
    </div>

    <script>
        // Variáveis para guardar a quantidade de vegetais colhidos
        let cenouras = 0;
        let tomates = 0;
        let alfaces = 0;

        // Função que é chamada ao clicar no canteiro
        function colher(tipoVegetal) {
            if (tipoVegetal === 'cenoura') {
                cenouras++;
                document.getElementById('qtd-cenoura').innerText = cenouras;
            } else if (tipoVegetal === 'tomate') {
                tomates++;
                document.getElementById('qtd-tomate').innerText = tomates;
            } else if (tipoVegetal === 'alface') {
                alfaces++;
                document.getElementById('qtd-alface').innerText = alfaces;
            }

            // Mensagem rápida no console do navegador apenas para registrar
            console.log("Você colheu um(a) " + tipoVegetal);
        }
    </script>

</body>
</html>
