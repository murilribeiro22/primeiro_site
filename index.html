<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazenda Suprema: Movimento e Interação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Fazenda: Movimento & Interação</h1>
        <div class="controls-info">
            <p>🏃 <b>Movimento:</b> Setas do Teclado ou WASD</p>
            <p>🛑 <b>Interagir:</b> Barra de Espaço (Spacebar)</p>
        </div>
        <p class="instructions"><b>Missão:</b> Vá até a Enxada (⛏️), aperte Espaço para coletar. Depois faça o mesmo com o Regador (💧) e abra o Portão (🚧)! Cuidado com as cercas (🪵).</p>
        
        <div id="farm-grid"></div>

        <div class="inventory">
            <span>Inventário: </span>
            <span id="inv-hoe" class="inv-item grayed">⛏️ Enxada</span>
            <span id="inv-water" class="inv-item grayed">💧 Regador</span>
        </div>

        <button id="reset-btn" onclick="resetGame()">Reiniciar Jogo</button>
        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
