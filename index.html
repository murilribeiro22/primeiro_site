<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle de Blocos: Fazenda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Logística Agrícola: Movimento de Blocos</h1>
        
        <div class="status-panel">
            <div>Movimentos: <span id="moves-display">0</span></div>
            <div>Carga: <span id="cargo-display">Nenhuma</span></div>
        </div>
        
        <div id="farm-grid"></div>

        <div class="legend">
            <div><span class="box-legend player-box"></span> Bloco Trator</div>
            <div><span class="box-legend seed-box"></span> Bloco Semente</div>
            <div><span class="box-legend target-box"></span> Bloco Destino</div>
        </div>

        <button id="reset-btn" onclick="resetGame()">Reiniciar Bloco</button>
        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
